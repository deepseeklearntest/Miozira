name: Miozira CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Test and assemble
        run: ./gradlew :shared:testDebugUnitTest :androidApp:assembleDebug :androidApp:checkManifestPolicy
      - name: Release lint
        run: ./gradlew :androidApp:lintRelease
